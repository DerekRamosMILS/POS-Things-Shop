name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 usa APIs que no existen antes de Node 22.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck y bundle
        run: pnpm build
      - name: Pruebas
        run: pnpm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Pruebas
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # El relevo guarda lo que el celular captura mientras la tienda lo recoge. Va
  # aparte del punto de venta —se despliega en Cloudflare—, así que tiene su
  # propio lockfile y sus propias pruebas, contra el runtime real de Workers.
  relevo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relevo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Pruebas del relevo
        run: pnpm test

  # El código de impresora y cajón usa la API de Windows y no compila en otro
  # sistema, así que se verifica en un runner de Windows en cada cambio.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compilar para Windows
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Pruebas en Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml
