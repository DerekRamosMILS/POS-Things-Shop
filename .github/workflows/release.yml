name: Release

# Publica el instalador de Windows y el manifiesto que consume el actualizador.
# Se dispara al empujar una etiqueta de versión: git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Verificación previa: no se publica un instalador que no pase pruebas.
      - name: Pruebas
        run: |
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # El certificado es opcional: sin él el instalador sale sin firmar y
      # Windows muestra la advertencia de editor desconocido, pero funciona.
      - name: Preparar certificado de firma
        if: env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
            [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          echo "WINDOWS_CERTIFICATE_PATH=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV

      - name: Construir instalador
        env:
          # Firma del actualizador: sin esto el .msi no lleva .sig y el
          # actualizador rechazará la versión.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Firmar el instalador
        if: env.WINDOWS_CERTIFICATE_PATH != ''
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH `
              /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      - name: Generar manifiesto del actualizador
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}".TrimStart('v') }

          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1
          $sig = Get-Content "$($msi.FullName).sig" -Raw -ErrorAction SilentlyContinue
          if (-not $sig) { throw "Falta el .sig: revisa el secreto TAURI_SIGNING_PRIVATE_KEY" }

          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($msi.Name)"
          $manifest = @{
            version   = $version
            notes     = "Consulta las notas de la versión en GitHub Releases."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = $url } }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            latest.json
          generate_release_notes: true
