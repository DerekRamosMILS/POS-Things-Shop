name: Release

# Publica el instalador de Windows y el manifiesto que consume el actualizador.
#
# El disparo normal es una etiqueta de versión, que la crea `pnpm publicar`:
#   pnpm publicar 0.2.0
#
# Ese script sube la versión en los tres archivos que la llevan, commitea y
# etiqueta. La reja de abajo confirma que la etiqueta y `tauri.conf.json` dicen
# lo mismo: si no coincidieran, la app instalaría una versión que se cree más
# vieja que el manifiesto y se reinstalaría en un bucle infinito.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 0.2.0). Debe coincidir con tauri.conf.json'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ── La reja contra el bucle de actualización ──────────────────────────
      #
      # El actualizador compara la versión horneada en el binario contra la del
      # manifiesto. Si la etiqueta va por delante de `tauri.conf.json`, publica
      # un manifiesto que anuncia una versión que el instalador no trae: la app
      # se instala, arranca, se cree vieja y se vuelve a instalar, para siempre.
      # En una tienda a distancia eso es un ladrillo, así que no se publica.
      - name: Comprobar que la versión cuadra
        shell: pwsh
        run: |
          $etiqueta = "${{ github.event.inputs.version }}"
          if (-not $etiqueta) { $etiqueta = "${{ github.ref_name }}".TrimStart('v') }
          $config = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $paquete = (Get-Content package.json -Raw | ConvertFrom-Json).version

          Write-Host "etiqueta=$etiqueta  tauri.conf.json=$config  Cargo.toml=$cargo  package.json=$paquete"
          if ($config -ne $etiqueta -or $cargo -ne $etiqueta -or $paquete -ne $etiqueta) {
            throw "La versión no coincide en todos lados. Usa 'pnpm publicar $etiqueta' en vez de etiquetar a mano."
          }
          echo "VERSION=$etiqueta" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Verificación previa: no se publica un instalador que no pase pruebas.
      # Lo que llega aquí se instala solo en la tienda, sin que nadie lo revise.
      - name: Pruebas
        run: |
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Construir instalador
        env:
          # Firma del actualizador: sin esto el instalador no lleva .sig y la app
          # rechaza la versión por no poder comprobar de dónde viene.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # `productName` lleva espacios, así que el instalador sale como
      # "Things Shop POS_0.2.1_x64-setup.exe" — y GitHub, al publicarlo, cambia
      # los espacios por puntos. El manifiesto quedaba apuntando al nombre local,
      # a una URL que no existe, y la actualización fallaba callada.
      #
      # Se renombra aquí, antes de firmar y de armar el manifiesto, para que no
      # haya que adivinar cómo normaliza GitHub: el nombre ya no tiene nada que
      # normalizar. La firma es sobre el contenido, así que renombrar no la afecta.
      - name: Renombrar el instalador a un nombre sin espacios
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "No se encontró el instalador de NSIS" }

          $nombre = "things-shop-pos_${env:VERSION}_x64-setup.exe"
          $destino = Join-Path $exe.Directory $nombre
          Move-Item $exe.FullName $destino -Force
          if (Test-Path "$($exe.FullName).sig") {
            Move-Item "$($exe.FullName).sig" "$destino.sig" -Force
          }
          Write-Host "$($exe.Name) -> $nombre"
          echo "INSTALADOR=$nombre" >> $env:GITHUB_ENV

      # El certificado de Windows es opcional y es otra cosa que la firma del
      # actualizador: sirve para que SmartScreen no muestre "editor desconocido".
      - name: Preparar certificado de firma
        if: env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
            [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          echo "WINDOWS_CERTIFICATE_PATH=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV

      # Firmar cambia los bytes del instalador, así que la firma del actualizador
      # que `tauri build` acabó de calcular deja de cuadrar y la app rechazaría la
      # actualización. Hay que volver a firmarla DESPUÉS de signtool, no antes.
      - name: Firmar el instalador y rehacer su firma
        if: env.WINDOWS_CERTIFICATE_PATH != ''
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          $exe = Join-Path "src-tauri\target\release\bundle\nsis" $env:INSTALADOR
          & $signtool.FullName sign /fd SHA256 /f $env:WINDOWS_CERTIFICATE_PATH `
            /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool falló" }
          # Firmar cambió los bytes: la firma del actualizador hay que rehacerla.
          pnpm tauri signer sign $exe
          if ($LASTEXITCODE -ne 0) { throw "no se pudo rehacer la firma del actualizador" }

      - name: Generar manifiesto del actualizador
        shell: pwsh
        run: |
          $exe = Join-Path "src-tauri\target\release\bundle\nsis" $env:INSTALADOR
          if (-not (Test-Path $exe)) { throw "No se encontró $env:INSTALADOR" }

          $sig = Get-Content "$exe.sig" -Raw -ErrorAction SilentlyContinue
          if (-not $sig) { throw "Falta el .sig: revisa el secreto TAURI_SIGNING_PRIVATE_KEY" }

          # Un nombre con algo que una URL tenga que escapar vuelve a meternos en
          # el problema que este renombrado resuelve.
          if ($env:INSTALADOR -notmatch '^[A-Za-z0-9._-]+$') {
            throw "El nombre '$env:INSTALADOR' lleva caracteres que GitHub va a cambiar en la URL"
          }

          $url = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/$env:INSTALADOR"
          $manifest = @{
            version   = $env:VERSION
            notes     = "Consulta las notas de la versión en GitHub Releases."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = $url } }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
          generate_release_notes: true

      # La única comprobación que vale: pedir el manifiesto por donde lo pide la
      # app y bajar lo que anuncia. Un release "exitoso" con una URL que no
      # resuelve deja a la tienda sin actualizarse y sin decir nada — es
      # exactamente lo que pasó la primera vez, y lo que este paso no deja pasar.
      - name: Comprobar que la tienda puede descargarlo
        shell: pwsh
        run: |
          $endpoint = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"

          $manifiesto = $null
          foreach ($intento in 1..6) {
            try {
              $manifiesto = Invoke-RestMethod -Uri $endpoint -MaximumRedirection 10
              break
            } catch {
              Write-Host "El manifiesto todavía no responde (intento $intento). Esperando..."
              Start-Sleep -Seconds 10
            }
          }
          if (-not $manifiesto) { throw "El endpoint del actualizador no responde: $endpoint" }

          if ($manifiesto.version -ne $env:VERSION) {
            throw "El manifiesto publicado dice $($manifiesto.version) y esta versión es $env:VERSION"
          }

          $url = $manifiesto.platforms.'windows-x86_64'.url
          Write-Host "Instalador anunciado: $url"
          if (-not $manifiesto.platforms.'windows-x86_64'.signature) {
            throw "El manifiesto no lleva firma"
          }

          $respuesta = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 10
          if ($respuesta.StatusCode -ne 200) {
            throw "El instalador anunciado no se puede descargar (HTTP $($respuesta.StatusCode))"
          }
          Write-Host "✓ La tienda puede bajar la versión $env:VERSION"
