[package]
name = "things-shop"
version = "0.2.7"
description = "Things Shop - Professional POS System"
authors = ["Things Shop"]
edition = "2021"

[lib]
name = "things_shop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"
# Un relevo de mentira que habla HTTP de verdad, para probar la vuelta completa.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = { version = "0.4", features = ["std"] }

# QR del emparejamiento con el relevo.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# El relevo: el punto de venta recoge lo capturado con el celular. El mismo
# cliente y el mismo TLS que ya compila el actualizador: no es una segunda pila.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
