[package]
name = "things-shop"
version = "0.1.0"
description = "Things Shop - Professional POS System"
authors = ["Things Shop"]
edition = "2021"

[lib]
name = "things_shop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = { version = "0.4", features = ["std"] }

# Servidor de captura en red local: el celular sube fotos directo a la caja,
# sin nube ni backend externo.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Enumera las interfaces de red: con un VPN activo, preguntar "¿por dónde salgo
# a internet?" devuelve el túnel, que el celular no puede alcanzar.
local-ip-address = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
